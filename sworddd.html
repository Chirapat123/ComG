
<!doctype html>
<html>
  <head>
    <title>Animations</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      canvas {
        display: block;
      }
    </style>
  </head>

  <body>
    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>

    <script>
      // ---------- Renderer ----------
      const renderer = new THREE.WebGLRenderer({
        antialias: true
      });

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      document.body.appendChild(renderer.domElement);

      // ---------- Scene ----------
      const scene = new THREE.Scene();

      // ---------- Camera ----------
      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );

      camera.position.set(0, 2, -10);
      camera.lookAt(0, 0, 0);

      // ---------- Orbit Controls ----------
      const controls = new THREE.OrbitControls(
        camera,
        renderer.domElement
      );

      // ปลดล็อกการควบคุมกล้อง
      controls.enableRotate = true;
      controls.enableZoom = true;
      controls.enablePan = true;

      controls.minDistance = 1;
      controls.maxDistance = 200;

      controls.enableDamping = true;
      controls.dampingFactor = 0.08;

      // ---------- Light ----------
      const ambientLight = new THREE.AmbientLight(
        0x404040,
        1
      );

      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(
        0xffffff,
        0.5
      );

      directionalLight.position.set(10, 10, 10);
      directionalLight.castShadow = true;

      scene.add(directionalLight);

      // ---------- EXR Skybox ----------
      const exrSkyboxUrl =
        "https://chirapat123.github.io/qwantani_dusk_2_puresky_1k.exr";

      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      pmremGenerator.compileEquirectangularShader();

      new THREE.EXRLoader()
        .setDataType(THREE.UnsignedByteType)
        .load(
          exrSkyboxUrl,
          (texture) => {
            const skybox = pmremGenerator
              .fromEquirectangular(texture)
              .texture;

            scene.background = skybox;
            scene.environment = skybox;

            texture.dispose();
            pmremGenerator.dispose();
          },
          undefined,
          (error) => {
            console.error("Unable to load EXR skybox:", error);
          }
        );

      // ---------- Clock ----------
      const clock = new THREE.Clock();
      let mixer;

      const loader = new THREE.GLTFLoader();

      // ---------- Picking ----------
      const pickables = [];
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();

      // ---------- Camera Zoom ----------
      const defaultCamPos = camera.position.clone();
      const defaultTarget = controls.target.clone();

      let goalCamPos = null;
      let goalTarget = null;

      // ==========================================
      // VERTEX SHADER
      // ==========================================
      const vertexShader = `
        uniform float uTime;

        varying vec2 vUv;
        varying vec3 vNormal;

        void main() {
          vUv = uv;

          vec3 pos = position;

          // คลื่นเคลื่อนไหว
          pos.z += sin(pos.x * 5.0 + uTime) * 0.1;

          vNormal = normalize(normalMatrix * normal);

          gl_Position =
            projectionMatrix *
            modelViewMatrix *
            vec4(pos, 1.0);
        }
      `;

      // ==========================================
      // FRAGMENT SHADER
      // ==========================================
      const fragmentShader = `
        precision mediump float;

        uniform float uTime;
        uniform sampler2D uTexture;
        uniform vec3 uLightDir;

        varying vec2 vUv;
        varying vec3 vNormal;

        void main() {
          // อ่านสีจาก Texture
          vec3 color = texture2D(uTexture, vUv).rgb;

          // คำนวณแสง
          vec3 N = normalize(vNormal);
          vec3 L = normalize(uLightDir);

          float diffuse = max(dot(N, L), 0.0);

          // Toon shading
          diffuse = smoothstep(0.15, 0.2, diffuse);

          // Ambient light
          float ambient = 0.3;

          color *= diffuse + ambient;

          gl_FragColor = vec4(color, 1.0);
        }
      `;

      // ==========================================
      // OUTLINE VERTEX SHADER
      // ==========================================
      const outlineVertexShader = `
        uniform float uTime;

        void main() {
          vec3 pos = position;

          // ทำให้ขอบเคลื่อนไหวเหมือนตัวโมเดล
          pos.z += sin(pos.x * 5.0 + uTime) * 0.1;

          // ขยายโมเดลสำหรับทำขอบ
          pos += normal * 0.05;

          gl_Position =
            projectionMatrix *
            modelViewMatrix *
            vec4(pos, 1.0);
        }
      `;

      // ==========================================
      // OUTLINE FRAGMENT SHADER
      // ==========================================
      const outlineFragmentShader = `
        void main() {
          gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
        }
      `;

      // ---------- Load GLB ----------
      loader.load(
        "https://chirapat123.github.io/SwordNew.glb",

        (gltf) => {
          const model = gltf.scene;

          model.position.set(-8, -10, 30);
          model.scale.set(3, 3, 3);

          scene.add(model);

          model.traverse((child) => {
            if (!child.isMesh) return;

            child.castShadow = true;
            child.receiveShadow = true;

            // ใช้ Material ที่มี Texture
            const originalMaterial = Array.isArray(child.material)
              ? child.material[0]
              : child.material;

            if (
              originalMaterial &&
              originalMaterial.map
            ) {
              const texture = originalMaterial.map;

              // ---------- Shader Material ----------
              const shaderMaterial = new THREE.ShaderMaterial({
                uniforms: {
                  uTime: {
                    value: 0
                  },

                  uTexture: {
                    value: texture
                  },

                  uLightDir: {
                    value: new THREE.Vector3(0.5, 1.0, 1.0)
                      .normalize()
                  }
                },

                vertexShader: vertexShader,
                fragmentShader: fragmentShader
              });

              child.material = shaderMaterial;

              // ---------- Outline ----------
              const outlineMaterial = new THREE.ShaderMaterial({
                uniforms: {
                  uTime: {
                    value: 0
                  }
                },

                vertexShader: outlineVertexShader,
                fragmentShader: outlineFragmentShader,

                side: THREE.BackSide
              });

              const outline = new THREE.Mesh(
                child.geometry,
                outlineMaterial
              );

              outline.name = "Outline";

              child.add(outline);

              child.userData.outline = outline;

              // เพิ่มวัตถุสำหรับคลิกเลือก
              pickables.push(child);
            }
          });

          // ---------- GLTF Animation ----------
          mixer = new THREE.AnimationMixer(model);

          gltf.animations.forEach((clip) => {
            mixer.clipAction(clip).play();
          });
        },

        undefined,

        (error) => {
          console.error("Unable to load GLB model:", error);
        }
      );

      // ==========================================
      // PICK OBJECT
      // ==========================================
      renderer.domElement.addEventListener("click", onPick);

      function onPick(e) {
        const rect = renderer.domElement.getBoundingClientRect();

        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        pointer.x = (x / rect.width) * 2 - 1;
        pointer.y = -(y / rect.height) * 2 + 1;

        raycaster.setFromCamera(pointer, camera);

        const hit = raycaster.intersectObjects(
          pickables,
          false
        )[0];

        if (!hit) {
          // คลิกพื้นที่ว่างเพื่อกลับมุมกล้องเดิม
          goalCamPos = defaultCamPos.clone();
          goalTarget = defaultTarget.clone();
          return;
        }

        console.log("Picked:", hit.object.name, hit.object);

        zoomTo(hit);
      }

      // ==========================================
      // ZOOM TO OBJECT
      // ==========================================
      function zoomTo(hit) {
        const object = hit.object;

        const box = new THREE.Box3().setFromObject(object);

        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        const maxSize = Math.max(
          size.x,
          size.y,
          size.z
        );

        const fov = THREE.MathUtils.degToRad(camera.fov);

        const distance =
          (maxSize / 2 / Math.tan(fov / 2)) * 1.5;

        // หาทิศด้านหน้าของพื้นผิว
        const dir = hit.face
          ? hit.face.normal
              .clone()
              .transformDirection(object.matrixWorld)
              .normalize()
          : camera.position.clone().sub(center).normalize();

        if (dir.dot(camera.position.clone().sub(center)) < 0) {
          dir.negate();
        }

        goalTarget = center.clone();

        goalCamPos = center
          .clone()
          .add(dir.multiplyScalar(distance));
      }

      // ==========================================
      // ANIMATION LOOP
      // ==========================================
      function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta();
        const elapsed = clock.elapsedTime;

        if (mixer) {
          mixer.update(delta);
        }

        // อัปเดตเวลาของ Shader และ Outline
        scene.traverse((child) => {
          if (!child.isMesh) return;

          const materials = Array.isArray(child.material)
            ? child.material
            : [child.material];

          materials.forEach((material) => {
            if (
              material &&
              material.uniforms &&
              material.uniforms.uTime
            ) {
              material.uniforms.uTime.value = elapsed;
            }
          });
        });

        // ค่อย ๆ เคลื่อนกล้องไปยังเป้าหมาย
        if (goalCamPos && goalTarget) {
          camera.position.lerp(goalCamPos, 0.08);
          controls.target.lerp(goalTarget, 0.08);

          if (
            camera.position.distanceTo(goalCamPos) < 0.01
          ) {
            camera.position.copy(goalCamPos);
            controls.target.copy(goalTarget);

            goalCamPos = null;
            goalTarget = null;
          }
        }

        // เปิดให้หมุน ซูม และเลื่อนกล้องได้
        controls.update();

        renderer.render(scene, camera);
      }

      animate();

      // ---------- Resize ----------
      window.addEventListener("resize", () => {
        camera.aspect =
          window.innerWidth / window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );
      });
    </script>
  </body>
</html>
